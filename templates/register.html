{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<h2>Create account</h2><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>Username</label><input name="username" minlength="3" maxlength="30" required autocomplete="username">
<label>Password (10–128 characters)</label><input type="password" name="password" minlength="10" maxlength="128" required autocomplete="new-password">
<button>Create account</button></form><p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>{% endblock %}
